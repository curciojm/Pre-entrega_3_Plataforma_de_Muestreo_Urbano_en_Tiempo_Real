
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: urban-data

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: urban-data
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
      - persistentvolumeclaims
    verbs:
      - create
      - get
      - list
      - watch
      - patch
      - delete
      - deletecollection

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role-binding
  namespace: urban-data
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: urban-data
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io
